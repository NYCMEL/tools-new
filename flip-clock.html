<!DOCTYPE html>
<html lang="en">
    <head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
	<title>Flip Clock</title>
	<style>
	 * { box-sizing: border-box; }
	 html, body {
	     margin: 0;
	     width: 100%;
	     height: 100%;
	     background: #000000;
	     overflow: hidden;
	     font-family: Arial, Helvetica, sans-serif;
	     -webkit-user-select: none;
	     user-select: none;
	 }
	 body {
	     display: flex;
	     align-items: center;
	     justify-content: center;
	     padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
	 }
	 .clock {
	     width: 100%;
	     height: 100%;
	     display: flex;
	     align-items: center;
	     justify-content: center;
	     padding: 3vh 3vw;
	 }
	 .time {
	     position: relative;
	     width: max-content;
	     display: flex;
	     justify-content: center;
	     align-items: center;
	     gap: 1.5vw;
	 }
	 .pair {
	     display: flex;
	     gap: 1.2vw;
	 }
	 .colon {
	     color: #272323;
	     font-size: clamp(52px, 8vw, 120px);
	     font-weight: 900;
	     line-height: 1;
	     transform: translateY(-1vh);
	 }
	 .flip {
	     position: relative;
	     width: min(20vw, 260px);
	     height: min(35vw, 430px);
	     max-height: 68vh;
	     perspective: 1000px;
	 }
	 .card {
	     position: absolute;
	     inset: 0;
	     border-radius: 7%;
	     overflow: hidden;
	     background:
		 linear-gradient(to bottom, rgba(255,255,255,.03), rgba(0,0,0,.18)),
		 #252122;
	     box-shadow:
		 inset 0 0 28px rgba(255,255,255,.025),
		 inset 0 -28px 38px rgba(0,0,0,.24),
		 0 10px 24px rgba(0,0,0,.24);
	 }
	 .half {
	     position: absolute;
	     left: 0;
	     width: 100%;
	     height: 50%;
	     overflow: hidden;
	     background:
		 linear-gradient(to bottom, rgba(255,255,255,.04), rgba(0,0,0,.06)),
		 #282425;
	 }
	 .top { top: 0; border-radius: 7% 7% 0 0; }
	 .bottom { bottom: 0; border-radius: 0 0 7% 7%; }
	 .digit {
	     position: absolute;
	     left: 0;
	     width: 100%;
	     height: 200%;
	     display: flex;
	     align-items: center;
	     justify-content: center;
	     color: #f4f0e8;
	     font-family: "Arial Black", Impact, Arial, sans-serif;
	     font-size: min(31vw, 380px);
	     font-weight: 900;
	     line-height: 1;
	     letter-spacing: -0.06em;
	     text-shadow: 0 2px 0 rgba(255,255,255,.1);
	 }
	 .top .digit { top: 0; }
	 .bottom .digit { bottom: 0; }
	 .divider {
	     position: absolute;
	     left: 0;
	     right: 0;
	     top: 50%;
	     height: 1.2%;
	     transform: translateY(-50%);
	     background: rgba(10,10,10,.65);
	     box-shadow: 0 -1px 0 rgba(255,255,255,.08), 0 2px 5px rgba(0,0,0,.65);
	     z-index: 5;
	 }
	 .hinge {
	     position: absolute;
	     top: 50%;
	     width: 9%;
	     height: 15%;
	     transform: translateY(-50%);
	     border-radius: 45%;
	     z-index: 6;
	     background: linear-gradient(to right, #111, #9a9696 42%, #eee 50%, #8c8889 58%, #111);
	     box-shadow: 0 3px 8px rgba(0,0,0,.65);
	 }
	 .hinge.left { left: 4.5%; }
	 .hinge.right { right: 4.5%; }

	 .flap {
	     position: absolute;
	     left: 0;
	     width: 100%;
	     height: 50%;
	     overflow: hidden;
	     z-index: 4;
	     backface-visibility: hidden;
	     background: #282425;
	 }
	 .flap.top {
	     top: 0;
	     transform-origin: bottom;
	     border-radius: 7% 7% 0 0;
	 }
	 .flap.bottom {
	     bottom: 0;
	     transform-origin: top;
	     border-radius: 0 0 7% 7%;
	     transform: rotateX(90deg);
	 }
	 .flap.top .digit { top: 0; }
	 .flap.bottom .digit { bottom: 0; }

	 .flip.animating .flap.top { animation: flipTop .28s ease-in forwards; }
	 .flip.animating .flap.bottom { animation: flipBottom .28s .28s ease-out forwards; }

	 @keyframes flipTop {
	     from { transform: rotateX(0deg); }
	     to { transform: rotateX(-90deg); }
	 }
	 @keyframes flipBottom {
	     from { transform: rotateX(90deg); }
	     to { transform: rotateX(0deg); }
	 }

	 .ampm {
	     position: absolute;
	     left: calc(100% + 3vw);
	     top: 50%;
	     transform: translateY(-50%);
	     min-width: 6ch;
	     text-align: center;
	     font-size: clamp(18px, 2vw, 30px);
	     font-weight: 700;
	     color: #262222;
	     margin-left: 1vw;
	 }

	 @media (orientation: portrait) {
	     .time { gap: 1vw; }
	     .pair { gap: .8vw; }
	     .flip {
		 width: 20vw;
		 height: 34vw;
	     }
	     .colon { font-size: 8vw; }
	 }
	</style>
    </head>
    <body>
	<div class="clock">
	    <div class="time">
		<div class="pair" id="hours"></div>
		<div class="colon">:</div>
		<div class="pair" id="minutes"></div>
		<div class="ampm" id="ampm"></div>
	    </div>
	</div>

	<script>
	 function createFlipDigit(initial, mini=false) {
	     const root = document.createElement('div');
	     root.className = 'flip' + (mini ? ' mini' : '');
	     root.dataset.value = initial;
	     root.innerHTML = `
		 <div class="card">
		     <div class="half top static-top"><div class="digit">${initial}</div></div>
		     <div class="half bottom static-bottom"><div class="digit">${initial}</div></div>
		     <div class="flap top flip-top"><div class="digit">${initial}</div></div>
		     <div class="flap bottom flip-bottom"><div class="digit">${initial}</div></div>
		     <div class="divider"></div>
		     <div class="hinge left"></div>
		     <div class="hinge right"></div>
		 </div>`;
	     return root;
	 }

	 function setDigit(el, next) {
	     const current = el.dataset.value;
	     if (current === next) return;

	     const staticTop = el.querySelector('.static-top .digit');
	     const staticBottom = el.querySelector('.static-bottom .digit');
	     const flipTop = el.querySelector('.flip-top .digit');
	     const flipBottom = el.querySelector('.flip-bottom .digit');

	     // Flip directly from the currently displayed digit to the requested digit.
	     // Mark the new value immediately so the 250ms clock refresh cannot restart
	     // the same animation while it is still in progress.
	     el.dataset.value = next;

	     flipTop.textContent = current;
	     flipBottom.textContent = next;
	     staticTop.textContent = next;
	     staticBottom.textContent = current;

	     if (el._flipTimer) clearTimeout(el._flipTimer);
	     el.classList.remove('animating');
	     void el.offsetWidth;
	     el.classList.add('animating');

	     el._flipTimer = setTimeout(() => {
		 staticTop.textContent = next;
		 staticBottom.textContent = next;
		 flipTop.textContent = next;
		 flipBottom.textContent = next;
		 el.classList.remove('animating');
		 el._flipTimer = null;
	     }, 590);
	 }

	 function makeGroup(container, count, mini=false) {
	     const els = [];
	     for (let i=0; i<count; i++) {
		 const e = createFlipDigit('0', mini);
		 container.appendChild(e);
		 els.push(e);
	     }
	     return els;
	 }

	 const hourEls = makeGroup(document.getElementById('hours'), 2);
	 const minuteEls = makeGroup(document.getElementById('minutes'), 2);

	 function updateClock() {
	     const now = new Date();
	     let h = now.getHours();
	     const ampm = h >= 12 ? 'PM' : 'AM';
	     h = h % 12 || 12;
	     const m = now.getMinutes();

	     const hh = String(h).padStart(2, '0');
	     const mm = String(m).padStart(2, '0');

	     setDigit(hourEls[0], hh[0]);
	     setDigit(hourEls[1], hh[1]);
	     setDigit(minuteEls[0], mm[0]);
	     setDigit(minuteEls[1], mm[1]);
	     document.getElementById('ampm').textContent = ampm;
	 }

	 updateClock();
	 setInterval(updateClock, 250);
	</script>
    </body>
</html>
